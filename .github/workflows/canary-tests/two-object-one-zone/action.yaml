name: two-object-one-zone
description: Run the two-object-one-zone canary test against the prebuilt rook image
inputs:
  ceph-image:
    description: Ceph image to create the cluster with
    required: true
  kubernetes-version:
    description: kubernetes version to create the cluster with
    required: true
  rook-image-artifact:
    description: name of a prebuilt rook image artifact to import; empty builds rook in-job
    required: false
    default: ""
  use-tmate:
    description: the USE_TMATE secret, for pre-job debugging
    required: false
    default: ""
  artifact-name:
    description: name to publish collected logs under
    required: true

runs:
  using: "composite"
  steps:
    - name: consider (pre-job) debugging
      uses: ./.github/workflows/tmate_debug
      with:
        use-tmate: ${{ inputs.use-tmate }}
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

    - name: setup cluster resources
      uses: ./.github/workflows/integration-test-setup-cluster-resources
      with:
        kubernetes-version: ${{ inputs.kubernetes-version }}
        rook-image-artifact: ${{ inputs.rook-image-artifact }}

    - name: set Ceph version in CephCluster manifest
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh replace_ceph_image  "deploy/examples/cluster-test.yaml" "${{ inputs.ceph-image }}"

    - name: validate-yaml
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh validate_yaml

    - name: use local disk and create partitions for osds
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh use_local_disk
        tests/scripts/github-action-helper.sh create_partitions_for_osds

    - name: deploy cluster
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh deploy_cluster
        tests/scripts/github-action-helper.sh wait_for cephcluster my-cluster rook-ceph 240

    - name: create CephBlockPool(s), CephObjectZone, and CephObjectStore(s)
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        kubectl create -f deploy/examples/object-separate-pools-test.yaml
        kubectl create -f deploy/examples/two-object-one-zone-test.yaml
        tests/scripts/github-action-helper.sh wait_for cephobjectzone object-separate-pools rook-ceph 600
        tests/scripts/github-action-helper.sh wait_for cephobjectstore two-object-one-zone-alpha rook-ceph 600
        tests/scripts/github-action-helper.sh wait_for cephobjectstore two-object-one-zone-beta rook-ceph 600

    - name: check for pools created by RGW that are unexpected
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh test_object_separate_pools

    - name: verify that only one zone exists
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        [[ $(tests/scripts/github-action-helper.sh radosgw-admin zone list | jq '.zones | length') == "1" ]]

    - name: collect common logs
      if: always()
      uses: ./.github/workflows/collect-logs
      with:
        name: ${{ inputs.artifact-name }}

    - name: consider (post-job) debugging
      uses: ./.github/workflows/upterm_debug
      with:
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}
