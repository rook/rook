name: raw-disk-with-object
description: Run the raw-disk-with-object canary test against the prebuilt rook image
inputs:
  ceph-image:
    description: Ceph image to create the cluster with
    required: true
  kubernetes-version:
    description: kubernetes version to create the cluster with
    required: true
  rook-image-artifact:
    description: name of a prebuilt rook image artifact to import; empty builds rook in-job
    required: false
    default: ""
  use-tmate:
    description: the USE_TMATE secret, for pre-job debugging
    required: false
    default: ""
  artifact-name:
    description: name to publish collected logs under
    required: true

runs:
  using: "composite"
  steps:
    - name: consider (pre-job) debugging
      uses: ./.github/workflows/tmate_debug
      with:
        use-tmate: ${{ inputs.use-tmate }}
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

    - name: setup cluster resources
      uses: ./.github/workflows/integration-test-setup-cluster-resources
      with:
        kubernetes-version: ${{ inputs.kubernetes-version }}
        rook-image-artifact: ${{ inputs.rook-image-artifact }}

    - name: set Ceph version in CephCluster manifest
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh replace_ceph_image  "deploy/examples/cluster-test.yaml" "${{ inputs.ceph-image }}"

    - name: validate-yaml
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh validate_yaml

    - name: set up the first and second disks as OSDs
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        # find_second_block_dev provisions a second iSCSI disk if the runner
        # has only one
        tests/scripts/github-action-helper.sh use_local_disk
        BLOCK="/dev/$(tests/scripts/github-action-helper.sh find_extra_block_dev)"
        export BLOCK
        tests/scripts/create-bluestore-partitions.sh --disk "$BLOCK" --wipe-only
        EXTRA_DEV="$(tests/scripts/github-action-helper.sh find_second_block_dev)"
        sudo sgdisk --zap-all "/dev/$EXTRA_DEV" || true

    - name: deploy cluster
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        ROOK_DATA_DEV="$(tests/scripts/github-action-helper.sh find_extra_block_dev)"
        ROOK_EXTRA_DEV="$(tests/scripts/github-action-helper.sh find_second_block_dev)"
        export ROOK_DATA_DEV ROOK_EXTRA_DEV
        tests/scripts/github-action-helper.sh deploy_cluster two_raw_disks
        tests/scripts/github-action-helper.sh deploy_all_additional_resources_on_cluster
        tests/scripts/github-action-helper.sh create_operator_toolbox

    - name: wait for prepare pod
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh wait_for_prepare_pod 2

    - name: wait for ceph to be ready
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh wait_for_ceph_to_be_ready osd 2

    - name: wait for object stores to be ready
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/validate_cluster.sh rgw store-a
        tests/scripts/validate_cluster.sh rgw store-b

    - name: test toolbox-operator-image pod
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        # waiting for toolbox operator image pod to get ready
        kubectl -n rook-ceph wait --for=condition=ready pod -l app=rook-ceph-tools-operator-image  --timeout=180s

    - name: check s5cmd version in the toolbox image
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        toolbox=$(kubectl get pod -l app=rook-ceph-tools-operator-image -n rook-ceph -o jsonpath='{.items[*].metadata.name}')
        s5cmd_version="$(kubectl -n rook-ceph exec "${toolbox}" -- /usr/local/bin/s5cmd version)"
        echo "${s5cmd_version}" | grep -q "^v2.3.0"  || {
           echo " Error: the version of s5cmd version in the  toolbox is not the expected v2.3.0 but ${s5cmd_version}"
           exit 1
        }

    - name: check-ownerreferences
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh check_ownerreferences

    - name: collect common logs
      if: always()
      uses: ./.github/workflows/collect-logs
      with:
        name: ${{ inputs.artifact-name }}
    - name: consider (post-job) debugging
      uses: ./.github/workflows/upterm_debug
      with:
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}
