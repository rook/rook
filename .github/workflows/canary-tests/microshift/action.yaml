name: microshift
description: Deploy Rook on MicroShift (via podman) and validate Ceph cluster with RBD workload
inputs:
  rook-image-artifact:
    description: name of a prebuilt rook image artifact to import
    required: true
  artifact-name:
    description: name to publish collected logs under
    required: true

runs:
  using: "composite"
  steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: true
        large-packages: false
        android: false
        dotnet: false
        haskell: false

    - name: install OpenShift CLI (oc)
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
        tar -xzf openshift-client-linux.tar.gz oc
        sudo mv oc /usr/local/bin/
        rm -f openshift-client-linux.tar.gz
        oc version --client

    - name: load kernel modules
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || sudo apt-get install -y -qq linux-modules-extra-azure || true
        sudo modprobe rbd nbd

    - name: create iSCSI disks for OSDs
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh create_extra_disk 3
        sudo lsblk

    - name: start MicroShift cluster
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        # Run MicroShift directly via podman instead of MINC so that we can
        # bind-mount /dev and /lib/modules from the host.  Without /dev:/dev
        # the nbd and rbd device nodes created by kernel modules are invisible
        # to pods running inside the nested CRI-O, which breaks both krbd and
        # rbd-nbd CSI volume attachment.  This is the same approach used by
        # the dfmicro project (github.com/leelavg/dfmicro).
        MINC_IMAGE="quay.io/minc-org/minc:4.19.0-okd-scos.17-amd64"
        sudo podman pull "${MINC_IMAGE}"
        GRAPH_ROOT="$(sudo podman info --format '{{.Store.GraphRoot}}')"
        sudo podman create \
          --hostname 127.0.0.1.nip.io \
          --label "io.x-openshift.microshift.cluster=microshift" \
          -it --privileged \
          -p 127.0.0.1:9080:80 \
          -p 127.0.0.1:9443:443 \
          -p 127.0.0.1:6443:6443 \
          --volume /dev:/dev \
          --volume "/lib/modules:/lib/modules:ro" \
          --volume "${GRAPH_ROOT}:/host-container:ro,rshared" \
          --name microshift \
          "${MINC_IMAGE}"
        sudo podman start microshift
        # Wait for MicroShift systemd service to become active.
        timeout 300 bash -c 'until sudo podman exec microshift systemctl is-active microshift 2>/dev/null; do sleep 5; done'
        # Extract kubeconfig (same path MINC reads it from).
        mkdir -p "$HOME/.kube"
        timeout 120 bash -c '
          until sudo podman exec microshift \
            cat /var/lib/microshift/resources/kubeadmin/127.0.0.1.nip.io/kubeconfig \
            > "$HOME/.kube/config" 2>/dev/null && [ -s "$HOME/.kube/config" ]; do
            sleep 5
          done'
        chmod 600 "$HOME/.kube/config"
        oc wait --for=condition=Ready node --all --timeout=300s
        oc get nodes -o wide
        oc get pods -A -o wide

    - name: download prebuilt rook image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.rook-image-artifact }}
        path: _output/ci-image

    - name: load rook image into MicroShift
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        zstd -dc _output/ci-image/rook-image.tar.zst | docker load
        docker save docker.io/rook/ceph:local-build | \
          sudo podman exec -i microshift podman load

    - name: deploy rook operator
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        cd deploy/examples
        sed -i 's|image: .*rook/ceph:.*|image: docker.io/rook/ceph:local-build|g' operator-openshift.yaml
        oc create -f crds.yaml -f common.yaml
        oc create -f csi-operator.yaml
        oc create -f operator-openshift.yaml

    - name: patch RBD Driver CR for kernel module access
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        # The ceph-csi node plugin must be able to run "modprobe nbd" so that
        # its hasNBD flag is true and rbd-nbd is used instead of silently
        # falling back to krbd.  Mount /lib/modules from the host (which in
        # turn is the CI runner's /lib/modules via the podman bind-mount).
        kubectl -n rook-ceph patch driver rook-ceph.rbd.csi.ceph.com --type=merge -p '
        spec:
          nodePlugin:
            volumes:
              - mount:
                  name: lib-modules
                  mountPath: /lib/modules
                  readOnly: true
                volume:
                  name: lib-modules
                  hostPath:
                    path: /lib/modules
                    type: Directory'

    - name: wait for operator to be ready
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        oc -n rook-ceph wait --for=condition=available deployment/rook-ceph-operator --timeout=300s
        oc -n rook-ceph get pods

    - name: install deps
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh install_deps

    - name: deploy ceph cluster
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        oc create -f deploy/examples/cluster-test.yaml
        tests/scripts/github-action-helper.sh deploy_toolbox

    - name: wait for prepare pod
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh wait_for_prepare_pod 3

    - name: wait for ceph to be ready
      shell: bash --noprofile --norc -eo pipefail -x {0}
      env:
        CSI_POD_MIN_COUNT: "4"
      run: tests/scripts/github-action-helper.sh wait_for_ceph_to_be_ready osd 3

    - name: verify ceph health ok
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        TOOLBOX="$(oc -n rook-ceph get pod -l app=rook-ceph-tools -o jsonpath='{.items[0].metadata.name}')"
        oc -n rook-ceph exec "${TOOLBOX}" -- ceph status
        oc -n rook-ceph exec "${TOOLBOX}" -- ceph health | grep -q HEALTH_OK

    - name: test rbd volume with rbd-nbd mounter
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        sed -i 's|#mounter: rbd-nbd|  mounter: rbd-nbd|g' deploy/examples/csi/rbd/storageclass-test.yaml
        tests/scripts/github-action-helper.sh test_csi_rbd_workload

    - name: deploy CephFilesystem
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: kubectl create -f deploy/examples/filesystem-test.yaml

    - name: wait for CephFS MDS to be ready
      shell: bash --noprofile --norc -eo pipefail -x {0}
      env:
        CSI_POD_MIN_COUNT: "4"
      run: |
        tests/scripts/github-action-helper.sh wait_for_ceph_to_be_ready mds 3
        sleep 10
        kubectl -n rook-ceph get cephfilesystem

    - name: test cephfs volume
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh test_csi_cephfs_workload

    - name: collect MicroShift logs
      if: always()
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        kubectl -n rook-ceph describe pod csirbd-demo-pod 2>/dev/null | tail -20 || true
        kubectl -n rook-ceph describe pod csicephfs-demo-pod 2>/dev/null | tail -20 || true
        kubectl -n rook-ceph logs -l app=ceph-csi-rbd-node -c csi-rbdplugin --tail=50 || true
        kubectl -n rook-ceph logs -l app=ceph-csi-cephfs-node -c csi-cephfsplugin --tail=50 || true
        mkdir -p test
        sudo podman logs microshift 2>&1 | tee test/microshift.log || true

    - name: collect common logs
      if: always()
      uses: ./.github/workflows/collect-logs
      with:
        name: ${{ inputs.artifact-name }}
