name: nvmeof-protocol
description: Run the nvmeof-protocol canary test against the prebuilt rook image
inputs:
  ceph-image:
    description: Ceph image to create the cluster with
    required: true
  kubernetes-version:
    description: kubernetes version to create the cluster with
    required: true
  rook-image-artifact:
    description: name of a prebuilt rook image artifact to import; empty builds rook in-job
    required: false
    default: ""
  use-tmate:
    description: the USE_TMATE secret, for pre-job debugging
    required: false
    default: ""
  artifact-name:
    description: name to publish collected logs under
    required: true

runs:
  using: "composite"
  steps:
    - name: consider (pre-job) debugging
      uses: ./.github/workflows/tmate_debug
      with:
        use-tmate: ${{ inputs.use-tmate }}
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

    - name: setup cluster resources
      uses: ./.github/workflows/integration-test-setup-cluster-resources
      with:
        kubernetes-version: ${{ inputs.kubernetes-version }}
        rook-image-artifact: ${{ inputs.rook-image-artifact }}

    - name: install nvme initiator prerequisites
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh install_nvme_initiator_prerequisites

    - name: set Ceph version in CephCluster manifest
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh replace_ceph_image "deploy/examples/cluster-test.yaml" "${{ inputs.ceph-image }}"

    - name: validate-yaml
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh validate_yaml

    - name: use local disk and create partitions for osds
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh use_local_disk
        tests/scripts/github-action-helper.sh create_partitions_for_osds

    - name: deploy cluster
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh deploy_manifest_with_local_build "deploy/examples/operator.yaml"
        tests/scripts/github-action-helper.sh deploy_manifest_with_local_build "deploy/examples/csi/nvmeof/driver.yaml"

        BLOCK="$(tests/scripts/github-action-helper.sh find_extra_block_dev)"
        export BLOCK
        yq w -i -d0 deploy/examples/cluster-test.yaml spec.storage.deviceFilter "${BLOCK}"
        kubectl create -f deploy/examples/cluster-test.yaml
        tests/scripts/github-action-helper.sh deploy_toolbox

    - name: wait for prepare pod
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh wait_for_prepare_pod 2

    - name: wait for ceph to be ready
      env:
        CSI_POD_MIN_COUNT: "6"
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh wait_for_ceph_to_be_ready osd 2

    - name: test ceph-csi-nvmeof plugin restart and data persistence
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh test_csi_nvmeof_workload

    - name: collect common logs
      if: always()
      uses: ./.github/workflows/collect-logs
      with:
        name: ${{ inputs.artifact-name }}
    - name: consider (post-job) debugging
      uses: ./.github/workflows/upterm_debug
      with:
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}
