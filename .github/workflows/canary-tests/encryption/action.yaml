name: encryption
description: Run the encryption canary test against the prebuilt rook image
inputs:
  ceph-image:
    description: Ceph image to create the cluster with
    required: true
  kubernetes-version:
    description: kubernetes version to create the cluster with
    required: true
  rook-image-artifact:
    description: name of a prebuilt rook image artifact to import; empty builds rook in-job
    required: false
    default: ""
  use-tmate:
    description: the USE_TMATE secret, for pre-job debugging
    required: false
    default: ""
  artifact-name:
    description: name to publish collected logs under
    required: true

runs:
  using: "composite"
  steps:
    - name: consider (pre-job) debugging
      uses: ./.github/workflows/tmate_debug
      with:
        use-tmate: ${{ inputs.use-tmate }}
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

    - name: setup cluster resources
      uses: ./.github/workflows/integration-test-setup-cluster-resources
      with:
        kubernetes-version: ${{ inputs.kubernetes-version }}
        rook-image-artifact: ${{ inputs.rook-image-artifact }}

    - name: set Ceph version in CephCluster manifest
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh replace_ceph_image  "deploy/examples/cluster-test.yaml" "${{ inputs.ceph-image }}"

    - name: validate-yaml
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh validate_yaml

    - name: use local disk as OSD
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        BLOCK="/dev/$(tests/scripts/github-action-helper.sh find_extra_block_dev)"
        export BLOCK
        tests/scripts/github-action-helper.sh use_local_disk
        tests/scripts/create-bluestore-partitions.sh --disk "$BLOCK" --wipe-only

    - name: deploy cluster
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh deploy_cluster encryption
        tests/scripts/github-action-helper.sh deploy_all_additional_resources_on_cluster encryption

    - name: wait for prepare pod
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh wait_for_prepare_pod 1

    - name: wait for ceph to be ready
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh wait_for_ceph_to_be_ready osd 1

    - name: check-ownerreferences
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: tests/scripts/github-action-helper.sh check_ownerreferences

    - name: verify CephX key rotation
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh test_rotate_cephx_keys
        tests/scripts/github-action-helper.sh wait_for_ceph_to_be_ready osd 1

    - name: collect common logs
      if: always()
      uses: ./.github/workflows/collect-logs
      with:
        name: ${{ inputs.artifact-name }}
    - name: consider (post-job) debugging
      uses: ./.github/workflows/upterm_debug
      with:
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}
