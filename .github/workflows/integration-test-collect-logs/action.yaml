# The canary tests use ./.github/workflows/collect-logs instead; the go
# integration tests write their logs elsewhere and publish them differently.
name: Integration test log collector
description: Collect go integration test logs, publish them, and offer post-job debugging
inputs:
  artifact-name:
    description: name to publish the collected logs under
    required: true
  cluster-namespaces:
    description: space-separated CephCluster namespaces to collect from
    required: true
  operator-namespace:
    description: operator namespace; empty means it matches the cluster namespace
    required: false
    default: ""
  upload:
    description: 'whether to upload the collected logs as an artifact; callers typically pass the outcome of their test step (e.g. steps.test.outcome != ''success'') to upload only on failure, or "true" to always upload'
    required: false
    default: "true"
    default: failure
  use-tmate:
    description: 'whether to use tmate for debugging'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: collect common logs
      if: always()
      shell: bash --noprofile --norc -eo pipefail -x {0}
      env:
        CLUSTER_NAMESPACES: ${{ inputs.cluster-namespaces }}
        OPERATOR_NAMESPACE: ${{ inputs.operator-namespace }}
      run: |
        export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
        export OPERATOR_NAMESPACE
        for ns in $CLUSTER_NAMESPACES; do
          CLUSTER_NAMESPACE="$ns" tests/scripts/collect-logs.sh
        done

    # Do not gate this on failure() here: this is a nested composite action, so
    # failure() only reflects the steps of this action, not the test step in the
    # calling suite that actually failed. The caller passes the upload decision
    # via the `upload` input, derived from its own test step's outcome. (Status
    # functions like failure() are only allowed in `if:`, not in `with:` values.)
    - name: Artifact
      if: ${{ always() && inputs.upload == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: /home/runner/work/rook/rook/tests/integration/_output/tests/

    - name: consider (post-job) debugging
      uses: ./.github/workflows/tmate_debug
      if: always()
      with:
        use-tmate: ${{ inputs.use-tmate }}
        debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}
