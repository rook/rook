name: Integration tests on master/release
on:
  push:
    tags:
      - v*
    branches:
      - master
      - release-*

defaults:
  run:
    # reference: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#using-a-specific-shell
    shell: bash --noprofile --norc -eo pipefail -x {0}

permissions:
  contents: read

env:
  # Required for go-ceph rgw/admin account APIs which are gated behind
  # the ceph_preview build tag. Can be removed when go-ceph promotes
  # the account API out of preview.
  GOFLAGS: "-tags=ceph_preview"

jobs:
  build-rook-image-amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true # removes old golang version but saves ~6GB
          large-packages: false # takes a long time to run b/c package mgr
          android: false # takes a long time to run b/c package mgr
          dotnet: false # takes a long time to run b/c package mgr
          haskell: false # takes a long time to run b/c package mgr

      - name: setup golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: build rook image
        run: tests/scripts/github-action-helper.sh build_rook_image_artifact

      - name: upload rook image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rook-image-amd64
          path: _output/ci-image
          retention-days: 7
          # the payload is already zstd-compressed
          compression-level: 0
          overwrite: true

  TestCephHelmSuite:
    needs: build-rook-image-amd64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.32.11", "v1.34.8", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephHelmSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          SKIP_TEST_CLEANUP=false SKIP_CLEANUP_POLICY=false go test -v -timeout 1800s -run CephHelmSuite github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="helm-ns"
          export OPERATOR_NAMESPACE="helm-ns-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-helm-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

  TestCephMultiClusterDeploySuite:
    needs: build-rook-image-amd64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.32.11", "v1.34.8", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephMultiClusterDeploySuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_NAME="$(tests/scripts/github-action-helper.sh find_extra_block_dev)"
          export BLOCK="$/dev/${DEVICE_NAME}"
          export TEST_SCRATCH_DEVICE="/dev/${DEVICE_NAME}"
          export DEVICE_FILTER="$DEVICE_NAME"
          go test -v -timeout 1800s -run CephMultiClusterDeploySuite github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export OPERATOR_NAMESPACE="multi-core-system"
          CLUSTER_NAMESPACE="multi-core" tests/scripts/collect-logs.sh
          CLUSTER_NAMESPACE="multi-external" tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-multi-cluster-deploy-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

  TestCephSmokeSuite:
    needs: build-rook-image-amd64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.32.11", "v1.34.8", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephSmokeSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          SKIP_CLEANUP_POLICY=false go test -v -timeout 1800s -run CephSmokeSuite github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="smoke-ns"
          export OPERATOR_NAMESPACE="smoke-ns-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-smoke-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

  TestCephUpgradeSuite:
    needs: build-rook-image-amd64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.32.11", "v1.34.8", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephUpgradeSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          go test -v -timeout 2400s -run CephUpgradeSuite/TestUpgradeRook github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="upgrade"
          export OPERATOR_NAMESPACE="upgrade-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-upgrade-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

  TestHelmUpgradeSuite:
    needs: build-rook-image-amd64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.32.11", "v1.34.8", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestHelmUpgradeSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          go test -v -timeout 1800s -run CephUpgradeSuite/TestUpgradeHelm github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="upgrade"
          export OPERATOR_NAMESPACE="upgrade-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-upgrade-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

  TestCephObjectSuite:
    needs: build-rook-image-amd64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14"]  # test only on oldest supported k8s version
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephObjectSuite (without TLS)
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          SKIP_CLEANUP_POLICY=false go test -v -timeout 2400s -failfast -run CephObjectSuite/TestWithoutTLS github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="object-ns"
          export OPERATOR_NAMESPACE="object-ns-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-object-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

  TestCephObjectSuiteTLS:
    needs: build-rook-image-amd64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.37.0"]  # test only on latest supported k8s version
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephObjectSuiteTLS
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          SKIP_CLEANUP_POLICY=false go test -v -timeout 2400s -failfast -run CephObjectSuite/TestWithTLS github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="object-ns"
          export OPERATOR_NAMESPACE="object-ns-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-object-suite-tls-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/
