name: TestCephMultiClusterDeploySuite
description: Run the Ceph multi-cluster deploy suite against the prebuilt rook image
inputs:
  kubernetes-version:
    description: kubernetes version to create the cluster with
    required: true

runs:
  using: "composite"
  steps:
    - name: setup cluster resources
      uses: ./.github/workflows/integration-test-setup-cluster-resources
      with:
        kubernetes-version: ${{ inputs.kubernetes-version }}
        rook-image-artifact: rook-image-amd64

    - name: TestCephMultiClusterDeploySuite
      shell: bash --noprofile --norc -eo pipefail -x {0}
      run: |
        tests/scripts/github-action-helper.sh collect_udev_logs_in_background
        DEVICE_NAME="$(tests/scripts/github-action-helper.sh find_extra_block_dev)"
        export BLOCK="/dev/${DEVICE_NAME}"
        export TEST_SCRATCH_DEVICE="/dev/${DEVICE_NAME}"
        export DEVICE_FILTER="$DEVICE_NAME"
        go test -v -timeout 1800s -failfast -run CephMultiClusterDeploySuite github.com/rook/rook/tests/integration

    - name: collect logs and publish them
      if: always()
      uses: ./.github/workflows/integration-test-collect-logs
      with:
        cluster-namespaces: multi-core multi-external
        operator-namespace: multi-core-system
        artifact-name: ceph-multi-cluster-deploy-suite-artifact-${{ inputs.kubernetes-version }}
        upload: "true"
