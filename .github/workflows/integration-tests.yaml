name: Integration tests
on:
  pull_request:
    branches:
      - master
      - release-*
    paths-ignore:
      - "Documentation/**"
      - "design/**"

defaults:
  run:
    # reference: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#using-a-specific-shell
    shell: bash --noprofile --norc -eo pipefail -x {0}

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Required for go-ceph rgw/admin account APIs which are gated behind
  # the ceph_preview build tag. Can be removed when go-ceph promotes
  # the account API out of preview.
  GOFLAGS: "-tags=ceph_preview"

jobs:
  # Every suite below consumes this one build instead of running its own.
  build-rook-image-amd64:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-ci')"
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true # removes old golang version but saves ~6GB
          large-packages: false # takes a long time to run b/c package mgr
          android: false # takes a long time to run b/c package mgr
          dotnet: false # takes a long time to run b/c package mgr
          haskell: false # takes a long time to run b/c package mgr

      - name: setup golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: build rook image
        run: tests/scripts/github-action-helper.sh build_rook_image_artifact

      - name: upload rook image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rook-image-amd64
          path: _output/ci-image
          retention-days: 7
          # the payload is already zstd-compressed
          compression-level: 0
          overwrite: true

  canary-tests:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-ci')"
    needs: build-rook-image-amd64
    uses: ./.github/workflows/canary-integration-test.yml
    with:
      ceph_images: '["quay.io/ceph/ceph:v19"]'
      rook_image_artifact: rook-image-amd64
    secrets: inherit

  TestCephSmokeSuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.36.1"]
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/tmate_debug
        with:
          use-tmate: ${{ secrets.USE_TMATE }}
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephSmokeSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          SKIP_CLEANUP_POLICY=false go test -v -timeout 1800s -failfast -run CephSmokeSuite github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="smoke-ns"
          export OPERATOR_NAMESPACE="smoke-ns-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-smoke-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

      - name: consider (post-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

  TestCephObjectSuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14"]  # test only on oldest supported k8s version
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/tmate_debug
        with:
          use-tmate: ${{ secrets.USE_TMATE }}
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephObjectSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          SKIP_CLEANUP_POLICY=false go test -v -timeout 2400s -failfast -run CephObjectSuite/TestWithoutTLS github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="object-ns"
          export OPERATOR_NAMESPACE="object-ns-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-object-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

      - name: consider (post-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

  TestCephObjectSuiteTLS:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.36.1"]  # test only on latest supported k8s version
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/tmate_debug
        with:
          use-tmate: ${{ secrets.USE_TMATE }}
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephObjectSuiteTLS
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          SKIP_CLEANUP_POLICY=false go test -v -timeout 2400s -failfast -run CephObjectSuite/TestWithTLS github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="object-ns"
          export OPERATOR_NAMESPACE="object-ns-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-object-suite-tls-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

      - name: consider (post-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

  TestCephHelmSuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        helm-version: ["v3.13.3", "v3.18.3"]
        kubernetes-version: ["v1.36.1"]
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ matrix.helm-version }}

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/tmate_debug
        with:
          use-tmate: ${{ secrets.USE_TMATE }}
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: remove read permission from kube config file
        run: sudo chmod go-r ~/.kube/config

      - name: TestCephHelmSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          SKIP_TEST_CLEANUP=false SKIP_CLEANUP_POLICY=false go test -v -timeout 1800s -failfast -run CephHelmSuite github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="helm-ns"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-helm-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

      - name: consider (post-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

  TestCephUpgradeSuite:
    needs: build-rook-image-amd64
    env:
      # Double the test framework's default wait budget (55 retries x 5s = 275s);
      # CI runners regularly need longer, e.g. for PVC binding while the CSI
      # pods are still starting during the initial cluster deploy.
      RETRY_MAX: "110"
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.36.1"]
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/tmate_debug
        with:
          use-tmate: ${{ secrets.USE_TMATE }}
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephUpgradeSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          go test -v -timeout 3600s -failfast -run CephUpgradeSuite/TestUpgradeRook github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="upgrade"
          export OPERATOR_NAMESPACE="upgrade-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-upgrade-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/
      - name: consider (post-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

  TestHelmUpgradeSuite:
    needs: build-rook-image-amd64
    env:
      # Double the test framework's default wait budget (55 retries x 5s = 275s);
      # CI runners regularly need longer, e.g. for PVC binding while the CSI
      # pods are still starting during the initial cluster deploy.
      RETRY_MAX: "110"
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.36.1"]
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.18.2

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/tmate_debug
        with:
          use-tmate: ${{ secrets.USE_TMATE }}
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestHelmUpgradeSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(tests/scripts/github-action-helper.sh find_extra_block_dev)
          export DEVICE_FILTER
          go test -v -timeout 2700s -failfast -run CephUpgradeSuite/TestUpgradeHelm github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="upgrade"
          export OPERATOR_NAMESPACE="upgrade-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-upgrade-helm-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

      - name: consider (post-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

  TestCephMultiClusterDeploySuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.36.1"]
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/tmate_debug
        with:
          use-tmate: ${{ secrets.USE_TMATE }}
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephMultiClusterDeploySuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_NAME="$(tests/scripts/github-action-helper.sh find_extra_block_dev)"
          export BLOCK="/dev/${DEVICE_NAME}"
          export TEST_SCRATCH_DEVICE="/dev/${DEVICE_NAME}"
          export DEVICE_FILTER="$DEVICE_NAME"
          go test -v -timeout 1800s -failfast -run CephMultiClusterDeploySuite github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export OPERATOR_NAMESPACE="multi-core-system"
          CLUSTER_NAMESPACE="multi-core" tests/scripts/collect-logs.sh
          CLUSTER_NAMESPACE="multi-external" tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ceph-multi-cluster-deploy-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

      - name: consider (post-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

  TestCephKeystoneAuthSuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.36.1"]
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.18.2

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/tmate_debug
        with:
          use-tmate: ${{ secrets.USE_TMATE }}
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: setup cluster resources
        uses: ./.github/workflows/integration-test-setup-cluster-resources
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          rook-image-artifact: rook-image-amd64

      - name: TestCephKeystoneAuthSuite
        run: |
          tests/scripts/github-action-helper.sh collect_udev_logs_in_background
          DEVICE_FILTER=$(lsblk|awk '/14G/ || /64G/ {print $1}'| head -1)
          export DEVICE_FILTER
          SKIP_CLEANUP_POLICY=false go test -v -timeout 3600s -failfast -run CephKeystoneAuthSuite github.com/rook/rook/tests/integration

      - name: collect common logs
        if: always()
        run: |
          export LOG_DIR="/home/runner/work/rook/rook/tests/integration/_output/tests/"
          export CLUSTER_NAMESPACE="keystoneauth-ns"
          export OPERATOR_NAMESPACE="keystoneauth-ns-system"
          tests/scripts/collect-logs.sh

      - name: Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ceph-keystone-auth-suite-artifact-${{ matrix.kubernetes-version }}
          path: /home/runner/work/rook/rook/tests/integration/_output/tests/

      - name: consider (post-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}
