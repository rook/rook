name: Integration tests
on:

  pull_request:
    branches:
      - master
      - release-*
    paths-ignore:
      - "Documentation/**"
      - "design/**"

defaults:

  run:
    # reference: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#using-a-specific-shell
    shell: bash --noprofile --norc -eo pipefail -x {0}

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Required for go-ceph rgw/admin account APIs which are gated behind
  # the ceph_preview build tag. Can be removed when go-ceph promotes
  # the account API out of preview.
  GOFLAGS: "-tags=ceph_preview"

jobs:
  # Every suite below consumes this one build instead of running its own.

  build-rook-image-amd64:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-ci')"
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true # removes old golang version but saves ~6GB
          large-packages: false # takes a long time to run b/c package mgr
          android: false # takes a long time to run b/c package mgr
          dotnet: false # takes a long time to run b/c package mgr
          haskell: false # takes a long time to run b/c package mgr

      - name: setup golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: build rook image
        run: tests/scripts/github-action-helper.sh build_rook_image_artifact

      - name: upload rook image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rook-image-amd64
          path: _output/ci-image
          retention-days: 7
          # the payload is already zstd-compressed
          compression-level: 0
          overwrite: true

  canary-tests:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-ci')"
    needs: build-rook-image-amd64
    uses: ./.github/workflows/canary-integration-test.yml
    with:
      ceph_images: '["quay.io/ceph/ceph:v20"]'
      rook_image_artifact: rook-image-amd64
    secrets: inherit

  TestCephSmokeSuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TestCephSmokeSuite
        uses: ./.github/workflows/integration-suites/smoke
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          use-tmate: ${{ secrets.USE_TMATE }}

  TestCephObjectSuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14"]  # test only on oldest supported k8s version
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TestCephObjectSuite
        uses: ./.github/workflows/integration-suites/object
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          use-tmate: ${{ secrets.USE_TMATE }}

  TestCephObjectSuiteTLS:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.37.0"]  # test only on latest supported k8s version
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TestCephObjectSuiteTLS
        uses: ./.github/workflows/integration-suites/object-tls
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          use-tmate: ${{ secrets.USE_TMATE }}

  TestCephHelmSuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        helm-version: ["v3.13.3", "v3.18.3"]
        kubernetes-version: ["v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm-version }}

      - name: TestCephHelmSuite
        uses: ./.github/workflows/integration-suites/helm
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          use-tmate: ${{ secrets.USE_TMATE }}

  TestCephUpgradeSuite:
    needs: build-rook-image-amd64
    env:
      # Double the test framework's default wait budget (55 retries x 5s = 275s);
      # CI runners regularly need longer, e.g. for PVC binding while the CSI
      # pods are still starting during the initial cluster deploy.
      RETRY_MAX: "110"
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TestCephUpgradeSuite
        uses: ./.github/workflows/integration-suites/upgrade
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          use-tmate: ${{ secrets.USE_TMATE }}

  TestHelmUpgradeSuite:
    needs: build-rook-image-amd64
    env:
      # Double the test framework's default wait budget (55 retries x 5s = 275s);
      # CI runners regularly need longer, e.g. for PVC binding while the CSI
      # pods are still starting during the initial cluster deploy.
      RETRY_MAX: "110"
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.2

      - name: TestHelmUpgradeSuite
        uses: ./.github/workflows/integration-suites/helm-upgrade
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          use-tmate: ${{ secrets.USE_TMATE }}

  TestCephMultiClusterDeploySuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TestCephMultiClusterDeploySuite
        uses: ./.github/workflows/integration-suites/multi-cluster
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          use-tmate: ${{ secrets.USE_TMATE }}

  TestCephKeystoneAuthSuite:
    needs: build-rook-image-amd64
    if: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/master' && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["v1.31.14", "v1.37.0"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.2

      - name: TestCephKeystoneAuthSuite
        uses: ./.github/workflows/integration-suites/keystone-auth
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          use-tmate: ${{ secrets.USE_TMATE }}
