version: 2
enable-beta-ecosystems: true
updates:
  # Dependencies listed in go.mod
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      golang-dependencies:
        patterns:
          - "github.com/golang*"
      k8s-dependencies:
        patterns:
          - "k8s.io*"
          - "sigs.k8s.io*"
      github-dependencies:
        patterns:
          - "github.com*"

  # Dependencies listed in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Dependabot treats each codeql-action subpath as its own dependency,
      # but every step in a workflow must run the same codeql-action version.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Dependabot updates only the default branch unless an entry sets
  # target-branch, which names one branch, so each maintained release branch
  # needs its own entry — revisit this pair when a minor is cut and the oldest
  # goes EOL. Security updates always target the default branch, so these
  # version updates are all a release branch gets: indirect dependencies are
  # allowed, and batched into one capped pull request to bound the review load.
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "release-1.21"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    allow:
      - dependency-type: "all"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # A major bump is not backport material, and one unwanted entry would
      # hold up the whole group.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "release-1.20"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    allow:
      - dependency-type: "all"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
