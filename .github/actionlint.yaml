# actionlint configuration.
# https://github.com/rhysd/actionlint/blob/main/docs/config.md
paths:
  # Composite actions live under .github/workflows/<name>/action.{yml,yaml}.
  # actionlint only understands workflow files, so it mis-parses these as
  # workflows ("jobs"/"on" section missing, unexpected "runs"/"inputs" keys).
  # It cannot lint composite action definitions, so ignore them entirely.
  "**/action.{yml,yaml}":
    ignore:
      - ".*"
  # gh aw compile generates these from their .md sources using syntax GitHub
  # accepts but actionlint does not know yet: the concurrency `queue` key, the
  # `job.workflow_ref` context property, and the `copilot-requests` permission.
  ".github/workflows/*.lock.yml":
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
      - 'property "workflow_ref" is not defined'
      - 'unknown permission scope "copilot-requests"'
