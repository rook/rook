{{- if .Values.toolbox.enabled -}}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: rook-ceph-tools
  namespace: {{ .Release.Namespace }} # namespace:cluster
  labels:
    app: rook-ceph-tools
    {{- with .Values.toolbox.labels }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  {{- if not (typeIs "<nil>" .Values.revisionHistoryLimit) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- end }}
  selector:
    matchLabels:
      app: rook-ceph-tools
  template:
    metadata:
      labels:
        app: rook-ceph-tools
        {{- with .Values.toolbox.labels }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      {{- $network := .Values.cephClusterSpec.network | default dict }}
      {{- if ($network.provider | default "") | eq "host" }}
      hostNetwork: true
      {{- end }}
      {{- with .Values.toolbox.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
        - name: rook-ceph-tools
          {{- if or .Values.toolbox.repository .Values.toolbox.tag }}
          image: "{{ .Values.toolbox.repository | default .Values.cephImage.repository }}:{{ .Values.toolbox.tag | default .Values.cephImage.tag }}"
          {{- else if .Values.toolbox.image }}
          image: {{ .Values.toolbox.image | quote }}
          {{- else }}
          image: "{{ .Values.cephImage.repository }}:{{ .Values.cephImage.tag }}"
          {{- end }}
          command:
            - /bin/bash
            - -c
            - |
              # The script is inlined because the ceph image does not ship toolbox.sh.
              # AUTOGENERATED from images/ceph/toolbox.sh; do not edit. Run: make gen-toolbox
              # inputs
              ENDPOINT_MOUNT="/etc/rook/mon-endpoints"
              KEYRING_MOUNT="/var/lib/rook-ceph-mon/secret.keyring"
              CONFIG_OVERRIDE_MOUNT="/etc/rook-config-override/config"

              # outputs
              CEPH_CONFIG="/etc/ceph/ceph.conf"
              KEYRING_FILE="/etc/ceph/keyring"

              config_override_exists() {
                [ -f "${CONFIG_OVERRIDE_MOUNT}" ] && [ -s "${CONFIG_OVERRIDE_MOUNT}" ]
              }

              # the mon endpoints configmap is created before any mon has an address, so on a new
              # cluster the projected file is missing or empty until the first mon is running
              wait_for_mon_endpoints() {
                while [ ! -s "${ENDPOINT_MOUNT}" ]; do
                  echo "$(date) waiting for mon endpoints in ${ENDPOINT_MOUNT}"
                  sleep 2
                done
              }

              # create/update the ceph keyring file
              write_keyring() {
                DATE=$(date)

                # read the secret from an env var (for backward compatibility), or from the secret file
                ceph_secret=${ROOK_CEPH_SECRET}
                if [[ "$ceph_secret" == "" ]]; then
                  ceph_secret=$(cat ${KEYRING_MOUNT})
                fi

                if [[ "$ceph_secret" == "" ]]; then
                  echo "$DATE no keyring secret found, keeping ${KEYRING_FILE} unchanged"
                  return
                fi

                echo "$DATE writing keyring to ${KEYRING_FILE}"
                cat <<EOF > "${KEYRING_FILE}.tmp"
              [${ROOK_CEPH_USERNAME}]
              key = ${ceph_secret}
              EOF
                mv -f "${KEYRING_FILE}.tmp" "${KEYRING_FILE}"

              } # write_keyring()

              # create/update the ceph config file in its default location so ceph/rados tools can be used
              # without specifying any arguments
              write_conf() {
                DATE=$(date)

                # filter out the mon names
                # external cluster can have numbers or hyphens in mon names, handling them in regex
                # shellcheck disable=SC2001
                mon_endpoints=$(sed 's/[a-z0-9_-]\+=//g' "${ENDPOINT_MOUNT}" 2>/dev/null || true)

                if [ -z "${mon_endpoints}" ]; then
                  echo "$DATE no mon endpoints in ${ENDPOINT_MOUNT}, keeping ${CEPH_CONFIG} unchanged"
                  return
                fi

                config_override=""
                if config_override_exists; then
                  echo "$DATE merging config override from ${CONFIG_OVERRIDE_MOUNT}"
                  config_override=$(cat "${CONFIG_OVERRIDE_MOUNT}")
                fi

                echo "$DATE writing mon endpoints to ${CEPH_CONFIG}: ${mon_endpoints}"
                cat << EOF > "${CEPH_CONFIG}.tmp"
              [global]
              mon_host = ${mon_endpoints}

              [client.admin]
              keyring = ${KEYRING_FILE}

              ${config_override}
              EOF
                mv -f "${CEPH_CONFIG}.tmp" "${CEPH_CONFIG}"

              } # write_conf()

              # watch the ceph config directory and update if the mon endpoints or keyring change
              watch_etc_ceph() {
                # get the timestamp for the targets of the soft links
                keyring_mount_path=$(realpath "${KEYRING_MOUNT}")
                keyring_init_time=$(stat -c %Z "${keyring_mount_path}")

                endpoint_mount_path=$(realpath "${ENDPOINT_MOUNT}")
                endpoint_init_time=$(stat -c %Z "${endpoint_mount_path}")

                override_mount_path=""
                override_init_time=""
                if config_override_exists; then
                  override_mount_path=$(realpath "${CONFIG_OVERRIDE_MOUNT}")
                  override_init_time=$(stat -c %Z "${override_mount_path}")
                fi

                while true; do
                  sleep 10
                  DATE=$(date)

                  # keyring file
                  keyring_mount_path=$(realpath "${KEYRING_MOUNT}")
                  keyring_latest_time="$(stat -c %Z "${keyring_mount_path}")"

                  if [ "${keyring_latest_time}" != "${keyring_init_time}" ]; then
                    echo "$DATE keyring changed"
                    write_keyring
                    keyring_init_time="${keyring_latest_time}"
                  fi

                  # ceph.conf file / config override
                  endpoint_mount_path=$(realpath "${ENDPOINT_MOUNT}")
                  endpoint_latest_time=$(stat -c %Z "${endpoint_mount_path}")

                  override_mount_path=""
                  override_latest_time=""
                  if config_override_exists; then
                    override_mount_path=$(realpath "${CONFIG_OVERRIDE_MOUNT}")
                    override_latest_time=$(stat -c %Z "${override_mount_path}")
                  fi

                  need_conf_update=false

                  if [ "${endpoint_latest_time}" != "${endpoint_init_time}" ]; then
                    echo "$DATE mon endpoints changed"
                    need_conf_update=true
                  fi

                  if [ "${override_latest_time}" != "${override_init_time}" ]; then
                    echo "$DATE config override changed"
                    need_conf_update=true
                  fi

                  if $need_conf_update; then
                    write_conf
                    endpoint_init_time="${endpoint_latest_time}"
                    override_init_time="${override_latest_time}"
                  fi
                done
              }

              # write the initial config files
              write_keyring
              wait_for_mon_endpoints
              write_conf

              # continuously update the config files for mon failover and/or cephx key rotation
              if [ "$1" != "--skip-watch" ]; then
                watch_etc_ceph
              fi
              # END AUTOGENERATED
          imagePullPolicy: IfNotPresent
          tty: true
          readinessProbe:
            exec:
              command:
                - grep
                - -q
                - '^mon_host = .\+'
                - /etc/ceph/ceph.conf
            periodSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- .Values.toolbox.containerSecurityContext | toYaml | nindent 12 }}
          env:
            - name: ROOK_CEPH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-username
          {{- with .Values.toolbox.resources }}
          resources:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /etc/ceph
              name: ceph-config
            - name: mon-endpoint-volume
              mountPath: /etc/rook
            - name: ceph-admin-secret
              mountPath: /var/lib/rook-ceph-mon
            - name: rook-config-override
              mountPath: /etc/rook-config-override
              readOnly: true
      serviceAccountName: rook-ceph-default
      volumes:
        - name: ceph-admin-secret
          secret:
            secretName: rook-ceph-mon
            optional: false
            items:
              - key: ceph-secret
                path: secret.keyring
        - name: mon-endpoint-volume
          configMap:
            name: rook-ceph-mon-endpoints
            items:
              - key: data
                path: mon-endpoints
        - name: rook-config-override
          configMap:
            name: rook-config-override
            optional: true
        - name: ceph-config
          emptyDir: {}
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 5
        {{- with .Values.toolbox.tolerations }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
      {{- with .Values.toolbox.affinity }}
      affinity:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
{{- end }}
