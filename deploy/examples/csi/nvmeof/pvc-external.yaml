# PVC for external NVMe-oF consumption.
# The CSI driver provisions the RBD image and NVMe namespace on the gateway.
# External clients then discover and connect via LoadBalancer IPs (see nvmeof-lb.yaml).
#
# The VolumeAttributesClass controls which external host NQNs are allowed to
# connect to this volume (see volume-attributes-class.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nvmeof-external-volume
  namespace: default
spec:
  storageClassName: ceph-nvmeof-external
  volumeAttributesClassName: nvmeof-external-hosts
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
