# PVC for in-cluster NVMe-oF consumption.
# A pod in the cluster mounts this volume via the NVMe-oF CSI driver.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nvmeof-volume
  namespace: default
spec:
  storageClassName: ceph-nvmeof
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
